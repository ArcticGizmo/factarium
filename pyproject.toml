[project]
name = "factarium"
version = "0.1.0"
description = "A self-contained engineering-metrics system: collector, aggregator, shaper, and renderer in one artifact."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
]

# No [build-system] on purpose: factarium is a design repo with a runnable spike,
# not a distributable package. uv treats it as a virtual project — it manages the
# environment and lockfile but never builds/installs factarium itself as a wheel.
# Add a [build-system] later if any part of this becomes an installable library.

[dependency-groups]
# Metrics-as-tested-code is a core principle (see README) — pytest lives here so it
# ships in the dev environment without leaking into the runtime dependency set.
dev = [
    "pytest>=8.0",
]

[tool.uv]
# The storage-seam spike is imported as `from storage import ...` with demo.py as
# its entry point; nothing here is packaged, so no extra uv package config is needed.
